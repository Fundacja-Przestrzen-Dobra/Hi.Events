# Local stack: same application stack plus Mailpit (e-mail preview), reachable from the local network.
#   cp .env.example .env
#   docker compose -f docker-compose.local.yml up -d
# App:     http://<host-lan-ip>:8810
# Mailpit: http://<host-lan-ip>:8627
services:
  app:
    image: daveearley/hi.events-all-in-one:v2.0.0
    restart: unless-stopped
    ports:
      - "0.0.0.0:8810:80"
    env_file:
      - .env
    environment:
      # local overrides: everything goes to Mailpit, nothing leaves the machine
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: "null"
      MAIL_PASSWORD: "null"
      MAIL_ENCRYPTION: "null"
      MAIL_AUTO_TLS: "true"
      MAIL_VERIFY_PEER: "false"
    volumes:
      - app_storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "0.0.0.0:8627:8025"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  redisdata:
  app_storage:
